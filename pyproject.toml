[project]
name = "pdd2uipath"
version = "0.1.0"
description = "Approved PDD -> UiPath Studio project pipeline (WSL + Windows) with a Textual TUI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "typer>=0.15",
  "textual>=8.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "jinja2>=3.1",
  "rich>=13.9",
  "pdfplumber>=0.11",
  "python-docx>=1.2",
  "keyring>=25",
  "tomli-w>=1.0",
]

[project.scripts]
pdd2uipath = "pdd2uipath.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "pytest-textual-snapshot>=1.1",
  "ruff>=0.9",
  "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdd2uipath"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W", "C4", "PIE", "T20"]
ignore = ["RUF012", "RUF001", "RUF002", "RUF003", "SIM108", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "E501"]
"tests/fake_uip/fake_uip.py" = ["T20"]
"src/pdd2uipath/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pdd2uipath"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "docx", "docx.*", "keyring", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e' -q"
markers = [
  "e2e: opt-in end-to-end tests against the real Windows uip (run with: pytest -m e2e)",
  "windows: tests that only run on a Windows host",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["pdd2uipath"]
omit = ["*/tui/*"]
